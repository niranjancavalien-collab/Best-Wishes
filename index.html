<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>ScratchVault — Admin & Scratch Cards</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          boxShadow: {
            glow: "0 0 45px rgba(255,255,255,.07)",
            card: "0 20px 70px rgba(0,0,0,.45)"
          }
        }
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <style>
    html { color-scheme: dark; }
    body { margin:0; background:#0b0b0d; color:#f5f5f5; font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    * { box-sizing:border-box; }
    button,input,textarea { font:inherit; }
    .glass { background:rgba(24,24,27,.78); backdrop-filter:blur(16px); border:1px solid rgba(255,255,255,.08); }
    .foil { cursor:crosshair; touch-action:none; }
    .fade-in { animation:fade .35s ease both; }
    @keyframes fade { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .shine { position:relative; overflow:hidden; }
    .shine:after { content:""; position:absolute; inset:-100% 40%; background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent); transform:rotate(18deg); animation:shine 3.5s infinite; pointer-events:none; }
    @keyframes shine { 0%,55% { transform:translateX(-130%) rotate(18deg); } 100% { transform:translateX(180%) rotate(18deg); } }
  </style>
</head>
<body>
<div id="app"></div>

<script>
(() => {
  const STORAGE_KEY = "scratchVault.cards.v1";
  const ADMIN_KEY = "scratchVault.admin.v1";

  const app = document.getElementById("app");
  const qs = new URLSearchParams(location.search);
  const cardId = qs.get("cardId");

  const loadCards = () => {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"); }
    catch { return []; }
  };
  const saveCards = cards => localStorage.setItem(STORAGE_KEY, JSON.stringify(cards));
  const uid = () => Math.random().toString(36).slice(2, 8).toUpperCase() + Date.now().toString(36).slice(-4).toUpperCase();
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const mask = code => {
    const s = String(code || "");
    if (s.length <= 4) return "••••";
    return s.slice(0, Math.min(2, Math.floor(s.length/2))) + "••••••" + s.slice(-2);
  };
  const baseUrl = () => location.href.split("?")[0].split("#")[0];
  const linkFor = id => `${baseUrl()}?cardId=${encodeURIComponent(id)}`;

  function icon(name, cls="w-5 h-5") {
    const paths = {
      gift:`<path d="M20 12v8H4v-8M2 7h20v5H2z"/><path d="M12 7v13M12 7H7.5A2.5 2.5 0 1 1 10 4.5L12 7zm0 0h4.5A2.5 2.5 0 1 0 14 4.5L12 7z"/>`,
      plus:`<path d="M12 5v14M5 12h14"/>`,
      copy:`<rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>`,
      trash:`<path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 10v6m4-6v6"/>`,
      eye:`<path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12z"/><circle cx="12" cy="12" r="2.5"/>`,
      arrow:`<path d="M5 12h14m-6-6 6 6-6 6"/>`,
      back:`<path d="M19 12H5m6 6-6-6 6-6"/>`,
      check:`<path d="m5 12 4 4L19 6"/>`,
      link:`<path d="M10 13a5 5 0 0 0 7.07.07l2-2a5 5 0 0 0-7.07-7.07l-1.15 1.15"/><path d="M14 11a5 5 0 0 0-7.07-.07l-2 2A5 5 0 0 0 7 20l1.15-1.15"/>`
    };
    return `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${paths[name] || ""}</svg>`;
  }

  function adminLayout(active="create") {
    return `
      <div class="min-h-screen bg-[#0b0b0d]">
        <header class="sticky top-0 z-20 border-b border-white/10 bg-[#0b0b0d]/90 backdrop-blur-xl">
          <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
            <button onclick="location.href='${baseUrl()}'" class="flex items-center gap-3">
              <span class="w-9 h-9 rounded-xl bg-white text-black grid place-items-center">${icon("gift","w-5 h-5")}</span>
              <span class="font-bold tracking-tight">ScratchVault</span>
            </button>
            <span class="hidden sm:block text-xs text-zinc-500">Local demo storage • Admin Portal</span>
          </div>
        </header>
        <main class="max-w-6xl mx-auto px-4 sm:px-6 py-7 sm:py-10">
          <div class="flex flex-col sm:flex-row sm:items-end justify-between gap-5 mb-7">
            <div>
              <p class="text-xs uppercase tracking-[.2em] text-zinc-500 mb-2">Dashboard</p>
              <h1 class="text-3xl sm:text-4xl font-black tracking-tight">Gift card control center</h1>
              <p class="text-zinc-400 mt-2">Generate unique scratch cards and share their private links.</p>
            </div>
            <div class="flex gap-2 p-1 rounded-xl bg-zinc-900 border border-white/10">
              <button class="${active==="create" ? "bg-white text-black" : "text-zinc-400 hover:text-white"} px-4 py-2 rounded-lg text-sm font-semibold" onclick="showCreate()">Create New</button>
              <button class="${active==="manage" ? "bg-white text-black" : "text-zinc-400 hover:text-white"} px-4 py-2 rounded-lg text-sm font-semibold" onclick="showManage()">Manage</button>
            </div>
          </div>
          <div id="adminContent"></div>
        </main>
      </div>`;
  }

  function renderCreate() {
    app.innerHTML = adminLayout("create");
    document.getElementById("adminContent").innerHTML = `
      <section class="grid lg:grid-cols-[1.1fr_.9fr] gap-5 fade-in">
        <div class="glass rounded-3xl p-5 sm:p-7 shadow-card">
          <div class="flex items-center gap-3 mb-6">
            <span class="w-10 h-10 rounded-xl bg-white/10 grid place-items-center">${icon("gift")}</span>
            <div><h2 class="font-bold text-lg">Create card batch</h2><p class="text-sm text-zinc-500">One code becomes one unique card.</p></div>
          </div>
          <form id="generator" class="space-y-5">
            <div>
              <label class="block text-sm font-medium mb-2">Brand / Title</label>
              <input required id="brand" placeholder="Amazon, Flipkart, Custom Coupon" class="w-full rounded-xl bg-black/30 border border-white/10 px-4 py-3.5 outline-none focus:border-white/30" />
            </div>
            <div>
              <label class="block text-sm font-medium mb-2">Value / Amount</label>
              <input required id="value" placeholder="₹1000, $50, 20% OFF" class="w-full rounded-xl bg-black/30 border border-white/10 px-4 py-3.5 outline-none focus:border-white/30" />
            </div>
            <div>
              <div class="flex justify-between items-center mb-2">
                <label class="block text-sm font-medium">Secret codes</label>
                <span id="codeCount" class="text-xs text-zinc-500">0 codes</span>
              </div>
              <textarea required id="codes" rows="8" placeholder="AMZ-8K3P-91QZ&#10;AMZ-4M8T-72XA&#10;AMZ-9P2L-33KD" class="w-full rounded-xl bg-black/30 border border-white/10 px-4 py-3.5 outline-none focus:border-white/30 resize-y"></textarea>
              <p class="text-xs text-zinc-500 mt-2">Enter one code per line. Blank lines are ignored.</p>
            </div>
            <button class="w-full rounded-xl bg-white text-black font-bold py-3.5 hover:bg-zinc-200 transition flex items-center justify-center gap-2">
              ${icon("plus","w-5 h-5")} Generate Shareable Cards
            </button>
          </form>
        </div>
        <div class="rounded-3xl border border-white/10 bg-gradient-to-br from-zinc-900 to-black p-6 sm:p-7">
          <p class="text-xs uppercase tracking-[.18em] text-zinc-500 mb-4">How it works</p>
          <div class="space-y-5">
            ${[
              ["01","Add your reward","Set a brand, reward value, and one secret code per line."],
              ["02","Generate links","Each code gets a separate Card ID and shareable URL."],
              ["03","Customer scratches","The foil clears as they scratch. At 55%, the code is revealed."],
              ["04","One-time reveal","Reveal status is persisted locally and the card cannot be scratched again."]
            ].map(x=>`<div class="flex gap-4"><span class="text-xs font-bold text-zinc-600 pt-1">${x[0]}</span><div><h3 class="font-semibold">${x[1]}</h3><p class="text-sm text-zinc-500 mt-1">${x[2]}</p></div></div>`).join("")}
          </div>
          <div class="mt-8 rounded-2xl bg-white/[.04] border border-white/10 p-4 text-xs text-zinc-500">
            <b class="text-zinc-300">Demo note:</b> localStorage is browser-local. For real multi-user production use, replace the storage layer with a backend/database and server-side access controls.
          </div>
        </div>
      </section>`;
    const codes = document.getElementById("codes");
    codes.addEventListener("input", () => {
      const n = codes.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).length;
      document.getElementById("codeCount").textContent = `${n} code${n===1?"":"s"}`;
    });
    document.getElementById("generator").addEventListener("submit", e => {
      e.preventDefault();
      const brand = document.getElementById("brand").value.trim();
      const value = document.getElementById("value").value.trim();
      const list = [...new Set(codes.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean))];
      if (!list.length) return;
      const cards = loadCards();
      const created = list.map(code => ({
        id: uid(),
        brand, value, code,
        status:"Unrevealed",
        createdAt:new Date().toISOString()
      }));
      saveCards([...created, ...cards]);
      renderManage();
      toast(`${created.length} card${created.length===1?"":"s"} generated`);
    });
  }

  function renderManage() {
    app.innerHTML = adminLayout("manage");
    const cards = loadCards();
    document.getElementById("adminContent").innerHTML = `
      <section class="fade-in">
        <div class="grid sm:grid-cols-3 gap-3 mb-5">
          <div class="glass rounded-2xl p-4"><p class="text-xs text-zinc-500">Total cards</p><p class="text-2xl font-black mt-1">${cards.length}</p></div>
          <div class="glass rounded-2xl p-4"><p class="text-xs text-zinc-500">Unrevealed</p><p class="text-2xl font-black mt-1">${cards.filter(c=>c.status==="Unrevealed").length}</p></div>
          <div class="glass rounded-2xl p-4"><p class="text-xs text-zinc-500">Revealed</p><p class="text-2xl font-black mt-1">${cards.filter(c=>c.status==="Revealed").length}</p></div>
        </div>
        <div class="glass rounded-3xl overflow-hidden">
          <div class="p-5 border-b border-white/10 flex items-center justify-between gap-3">
            <div><h2 class="font-bold">Card inventory</h2><p class="text-sm text-zinc-500 mt-1">Manage links and reveal state.</p></div>
            <button onclick="showCreate()" class="rounded-xl bg-white text-black px-4 py-2.5 text-sm font-bold">+ New batch</button>
          </div>
          ${cards.length ? `
          <div class="hidden md:block overflow-x-auto">
            <table class="w-full text-sm">
              <thead class="text-left text-xs uppercase tracking-wider text-zinc-500 bg-black/20">
                <tr><th class="px-5 py-3">Card ID</th><th class="px-5 py-3">Code</th><th class="px-5 py-3">Value</th><th class="px-5 py-3">Status</th><th class="px-5 py-3 text-right">Actions</th></tr>
              </thead>
              <tbody>${cards.map(rowHtml).join("")}</tbody>
            </table>
          </div>
          <div class="md:hidden divide-y divide-white/10">${cards.map(card => `
            <div class="p-4">
              <div class="flex justify-between gap-3"><div><p class="font-semibold">${esc(card.brand)}</p><p class="text-xs text-zinc-500 mt-1">${esc(card.id)}</p></div>${statusPill(card.status)}</div>
              <div class="grid grid-cols-2 gap-3 mt-4 text-sm"><div><p class="text-xs text-zinc-500">Code</p><p class="font-mono mt-1">${esc(mask(card.code))}</p></div><div><p class="text-xs text-zinc-500">Value</p><p class="mt-1">${esc(card.value)}</p></div></div>
              <div class="grid grid-cols-3 gap-2 mt-4">
                <button onclick="copyLink('${card.id}')" class="rounded-lg bg-white/10 py-2 text-xs font-semibold">Copy Link</button>
                <button onclick="previewCard('${card.id}')" class="rounded-lg bg-white/10 py-2 text-xs font-semibold">Preview</button>
                <button onclick="deleteCard('${card.id}')" class="rounded-lg bg-red-500/10 text-red-300 py-2 text-xs font-semibold">Delete</button>
              </div>
            </div>`).join("")}
          </div>` : `<div class="p-14 text-center text-zinc-500"><div class="mx-auto w-12 h-12 rounded-2xl bg-white/5 grid place-items-center mb-4">${icon("gift")}</div><p class="font-medium text-zinc-300">No cards yet</p><p class="text-sm mt-1">Create a batch to populate your inventory.</p></div>`}
        </div>
      </section>`;
  }

  function rowHtml(card) {
    return `<tr class="border-t border-white/5 hover:bg-white/[.025]">
      <td class="px-5 py-4"><div class="font-mono text-xs">${esc(card.id)}</div><div class="text-xs text-zinc-500 mt-1">${esc(card.brand)}</div></td>
      <td class="px-5 py-4 font-mono">${esc(mask(card.code))}</td>
      <td class="px-5 py-4">${esc(card.value)}</td>
      <td class="px-5 py-4">${statusPill(card.status)}</td>
      <td class="px-5 py-4"><div class="flex justify-end gap-1">
        <button title="Copy unique link" onclick="copyLink('${card.id}')" class="p-2 rounded-lg hover:bg-white/10">${icon("link","w-4 h-4")}</button>
        <button title="Preview card" onclick="previewCard('${card.id}')" class="p-2 rounded-lg hover:bg-white/10">${icon("eye","w-4 h-4")}</button>
        <button title="Delete card" onclick="deleteCard('${card.id}')" class="p-2 rounded-lg hover:bg-red-500/10 text-red-300">${icon("trash","w-4 h-4")}</button>
      </div></td>
    </tr>`;
  }
  function statusPill(status) {
    return `<span class="inline-flex items-center gap-1.5 rounded-full px-2.5 py-1 text-xs font-semibold ${status==="Revealed" ? "bg-emerald-400/10 text-emerald-300" : "bg-amber-400/10 text-amber-300"}"><span class="w-1.5 h-1.5 rounded-full bg-current"></span>${status}</span>`;
  }
  function showCreate(){ renderCreate(); }
  function showManage(){ renderManage(); }
  window.showCreate=showCreate; window.showManage=showManage;

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select();
      const ok=document.execCommand("copy"); ta.remove(); return ok;
    }
  }
  async function copyLink(id) {
    if (await copyText(linkFor(id))) toast("Unique link copied");
  }
  window.copyLink=copyLink;
  function deleteCard(id) {
    if (!confirm("Delete this card? This cannot be undone.")) return;
    saveCards(loadCards().filter(c=>c.id!==id)); renderManage(); toast("Card deleted");
  }
  window.deleteCard=deleteCard;
  function previewCard(id){ location.href=linkFor(id); }
  window.previewCard=previewCard;

  function toast(msg) {
    const t=document.createElement("div");
    t.className="fixed z-50 bottom-5 left-1/2 -translate-x-1/2 rounded-full bg-white text-black px-4 py-2.5 text-sm font-semibold shadow-2xl fade-in";
    t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),1800);
  }

  function renderClient(card) {
    document.body.style.background = "#070707";

    if (!card) {
      app.innerHTML = `<main class="min-h-screen grid place-items-center px-5">
        <div class="w-full max-w-sm text-center">
          <div class="w-14 h-14 mx-auto rounded-2xl bg-white/10 grid place-items-center mb-5">${icon("gift","w-7 h-7")}</div>
          <h1 class="text-2xl font-black">Card not found</h1>
          <p class="text-zinc-500 mt-2">This scratch card link is invalid or no longer exists.</p>
          <button onclick="history.replaceState({},'',baseUrl()); renderCreate()" class="mt-6 rounded-xl bg-white text-black px-5 py-3 font-bold">Open Admin Portal</button>
        </div></main>`;
      return;
    }

    const initialRevealed = card.status === "Revealed";

    app.innerHTML = `<main class="min-h-screen flex items-center justify-center px-4 py-8 text-white">
      <div class="w-full max-w-[400px]">
        <section class="gift-card relative overflow-hidden rounded-[24px] bg-[#111111] border border-white/[0.07]">
          <div class="pointer-events-none absolute -top-32 -right-32 h-64 w-64 rounded-full bg-white/[0.025] blur-3xl"></div>

          <div class="relative p-5 sm:p-6">
            <header class="flex items-start justify-between">
              <div>
                <p class="text-[10px] uppercase tracking-[0.28em] text-neutral-500 font-bold">Digital Reward</p>
                <h1 class="mt-2 text-xl font-bold tracking-tight text-white">${esc(card.brand)}</h1>
              </div>

              <div class="w-[62px] text-right">
                <div class="text-[20px] font-bold tracking-tight text-white leading-none">${esc(card.brand.charAt(0).toUpperCase())}</div>
                <div class="mt-1 h-[3px] w-12 ml-auto rounded-full bg-white/80"></div>
              </div>
            </header>

            <div class="mt-7">
              <p class="text-xs text-neutral-500 font-medium">Gift card value</p>
              <div class="mt-1 flex items-baseline gap-2">
                <span class="text-4xl font-black tracking-tight">${esc(card.value)}</span>
              </div>
            </div>

            <div class="mt-5 flex items-center gap-3 rounded-xl border border-white/[0.06] bg-white/[0.025] p-3.5">
              <div class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-white/[0.06]">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" class="text-neutral-300">
                  <path d="M12 2v20M2 12h20" />
                </svg>
              </div>
              <p class="text-xs leading-5 text-neutral-400">Scratch the box below to reveal your code.</p>
            </div>

            <div class="mt-5">
              <div id="scratchWrapper" class="scratch-wrapper">
                <div class="voucher-code">
                  <div class="code-inner">
                    <div class="code-label">Your voucher code</div>
                    <div id="voucherCode" class="code-text">${esc(card.code)}</div>
                  </div>
                </div>

                <canvas id="scratchCanvas"></canvas>

                <div id="scratchHint" class="pointer-events-none absolute inset-0 flex items-center justify-center">
                  <div class="text-center pulse">
                    <svg class="scratch-icon" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.5">
                      <path d="M15.5 4.5L19.5 8.5" />
                      <path d="M13.5 6.5L17.5 10.5" />
                      <path d="M4 20l3.5-1 10-10-3.5-3.5-10 10L4 20z" />
                      <path d="M4 20l3-3" />
                    </svg>
                    <p class="text-[11px] font-bold uppercase tracking-[0.2em] text-white">Scratch Here</p>
                    <p class="mt-1 text-[9px] text-white/50">Drag your finger or mouse</p>
                  </div>
                </div>
              </div>
            </div>

            <div class="mt-3 flex items-center justify-between">
              <span id="scratchStatus" class="text-[10px] text-neutral-600">${initialRevealed ? "Code unlocked" : "Scratch to reveal"}</span>
              <span id="revealStatus" class="text-[10px] font-semibold text-neutral-600">${initialRevealed ? "100%" : "0%"}</span>
            </div>

            <div id="copySection" class="${initialRevealed ? "" : "hidden-after-reveal"} mt-5">
              <div class="mb-3 text-center">
                <p class="text-[10px] uppercase tracking-[0.2em] font-bold text-neutral-500">Code revealed</p>
              </div>
              <button id="copyButton" type="button" class="copy-button w-full rounded-xl bg-white px-4 py-3.5 text-sm font-bold text-black">Copy Code</button>
            </div>

            <footer class="mt-6 flex items-center justify-between text-[9px] text-neutral-600">
              <span>Digital Gift Voucher</span>
              <span>Secure • Instant • Redeemable</span>
            </footer>
          </div>
        </section>

        <p class="mt-4 text-center text-[10px] text-neutral-700">Digital reward card</p>
      </div>
    </main>`;

    if (initialRevealed) {
      const canvas = document.getElementById("scratchCanvas");
      if (canvas) canvas.style.display = "none";
      document.getElementById("scratchHint").style.display = "none";
      document.getElementById("scratchStatus").className = "text-[10px] font-semibold text-white/70";
      document.getElementById("revealStatus").className = "text-[10px] font-semibold text-white";
      bindCopy(card);
    } else {
      setupScratch(card);
    }
  }

  function bindCopy(card) {
    const copyButton = document.getElementById("copyButton");
    if (!copyButton) return;
    copyButton.onclick = async () => {
      const ok = await copyText(card.code);
      if (ok) {
        copyButton.textContent = "Copied! ✓";
        copyButton.classList.add("bg-neutral-200");
        setTimeout(() => {
          copyButton.textContent = "Copy Code";
          copyButton.classList.remove("bg-neutral-200");
        }, 1800);
      }
    };
  }

  function setupScratch(card) {
    const canvas = document.getElementById("scratchCanvas");
    const wrapper = document.getElementById("scratchWrapper");
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    const scratchHint = document.getElementById("scratchHint");
    const scratchStatus = document.getElementById("scratchStatus");
    const revealStatus = document.getElementById("revealStatus");
    const copySection = document.getElementById("copySection");

    const REVEAL_THRESHOLD = 0.55;
    const BRUSH_SIZE = 38;
    let isScratching = false;
    let revealed = false;
    let lastPoint = null;
    let canvasWidth = 0;
    let canvasHeight = 0;

    function resizeCanvas() {
      const rect = wrapper.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvasWidth = rect.width;
      canvasHeight = rect.height;
      canvas.width = Math.floor(canvasWidth * dpr);
      canvas.height = Math.floor(canvasHeight * dpr);
      canvas.style.width = canvasWidth + "px";
      canvas.style.height = canvasHeight + "px";
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      drawFoil();
    }

    function drawFoil() {
      const gradient = ctx.createLinearGradient(0, 0, canvasWidth, canvasHeight);
      gradient.addColorStop(0, "#565656");
      gradient.addColorStop(.18, "#a4a4a4");
      gradient.addColorStop(.35, "#6c6c6c");
      gradient.addColorStop(.52, "#c2c2c2");
      gradient.addColorStop(.68, "#777777");
      gradient.addColorStop(.84, "#a8a8a8");
      gradient.addColorStop(1, "#555555");

      ctx.globalCompositeOperation = "source-over";
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      for (let i = 0; i < 2200; i++) {
        const x = Math.random() * canvasWidth;
        const y = Math.random() * canvasHeight;
        const alpha = Math.random() * 0.15;
        ctx.fillStyle = Math.random() > .5 ? `rgba(255,255,255,${alpha})` : `rgba(0,0,0,${alpha})`;
        ctx.fillRect(x, y, Math.random() * 2.2 + .4, Math.random() * 1.2 + .4);
      }

      ctx.save();
      ctx.globalAlpha = .12;
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 1;
      for (let x = -canvasHeight; x < canvasWidth; x += 12) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x + canvasHeight, canvasHeight);
        ctx.stroke();
      }
      ctx.restore();

      const edge = ctx.createLinearGradient(0, 0, 0, canvasHeight);
      edge.addColorStop(0, "rgba(0,0,0,.25)");
      edge.addColorStop(.5, "rgba(255,255,255,.05)");
      edge.addColorStop(1, "rgba(0,0,0,.3)");
      ctx.fillStyle = edge;
      ctx.fillRect(0, 0, canvasWidth, canvasHeight);

      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "rgba(20,20,20,.65)";
      ctx.font = "700 12px Arial";
      ctx.fillText("SCRATCH TO REVEAL", canvasWidth / 2, canvasHeight / 2);
      ctx.font = "500 9px Arial";
      ctx.fillStyle = "rgba(20,20,20,.45)";
      ctx.fillText("Your code is hidden underneath", canvasWidth / 2, canvasHeight / 2 + 18);
    }

    function getPoint(event) {
      const rect = canvas.getBoundingClientRect();
      const src = event.touches && event.touches.length ? event.touches[0] : event;
      return { x: src.clientX - rect.left, y: src.clientY - rect.top };
    }

    function scratch(point) {
      if (revealed) return;
      ctx.globalCompositeOperation = "destination-out";
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.lineWidth = BRUSH_SIZE;

      if (lastPoint) {
        ctx.beginPath();
        ctx.moveTo(lastPoint.x, lastPoint.y);
        ctx.lineTo(point.x, point.y);
        ctx.stroke();
      }

      ctx.beginPath();
      ctx.arc(point.x, point.y, BRUSH_SIZE / 2, 0, Math.PI * 2);
      ctx.fill();
      lastPoint = point;
      checkRevealProgress();
    }

    function checkRevealProgress() {
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let transparent = 0;
      const step = 8;

      for (let i = 3; i < imageData.data.length; i += step * 4) {
        if (imageData.data[i] < 80) transparent++;
      }

      const totalSamples = Math.floor(imageData.data.length / (step * 4));
      const percent = transparent / totalSamples;
      const displayPercent = Math.min(Math.round(percent * 100), 100);

      revealStatus.textContent = `${displayPercent}%`;
      if (percent >= REVEAL_THRESHOLD) reveal();
    }

    function reveal() {
      if (revealed) return;
      revealed = true;

      ctx.clearRect(0, 0, canvasWidth, canvasHeight);
      scratchHint.style.display = "none";
      scratchStatus.textContent = "Code unlocked";
      scratchStatus.className = "text-[10px] font-semibold text-white/70";
      revealStatus.textContent = "100%";
      revealStatus.className = "text-[10px] font-semibold text-white";
      copySection.classList.remove("hidden-after-reveal");

      const cards = loadCards();
      const idx = cards.findIndex(c => c.id === card.id);
      if (idx >= 0) {
        cards[idx].status = "Revealed";
        cards[idx].revealedAt = new Date().toISOString();
        saveCards(cards);
      }
      card.status = "Revealed";

      bindCopy(card);
      celebrate();
    }

    function celebrate() {
      const duration = 2200;
      const end = Date.now() + duration;

      const interval = setInterval(() => {
        const timeLeft = end - Date.now();
        if (timeLeft <= 0) return clearInterval(interval);
        const particleCount = 35 * (timeLeft / duration);
        confetti({ particleCount, angle: 60, spread: 65, origin: { x: 0 } });
        confetti({ particleCount, angle: 120, spread: 65, origin: { x: 1 } });
      }, 180);

      confetti({ particleCount: 120, spread: 100, startVelocity: 45, scalar: .9, origin: { x: .5, y: .55 } });
    }

    canvas.addEventListener("mousedown", event => {
      if (revealed) return;
      isScratching = true;
      lastPoint = getPoint(event);
      scratch(lastPoint);
    });

    canvas.addEventListener("mousemove", event => {
      if (!isScratching || revealed) return;
      scratch(getPoint(event));
    });

    window.addEventListener("mouseup", () => {
      isScratching = false;
      lastPoint = null;
    });

    canvas.addEventListener("touchstart", event => {
      if (revealed) return;
      event.preventDefault();
      isScratching = true;
      lastPoint = getPoint(event);
      scratch(lastPoint);
    }, { passive: false });

    canvas.addEventListener("touchmove", event => {
      if (!isScratching || revealed) return;
      event.preventDefault();
      scratch(getPoint(event));
    }, { passive: false });

    canvas.addEventListener("touchend", event => {
      event.preventDefault();
      isScratching = false;
      lastPoint = null;
    }, { passive: false });

    resizeCanvas();
    window.addEventListener("resize", () => { if (!revealed) resizeCanvas(); });
  }

  // Expose for the invalid-card button.
  window.baseUrl=baseUrl; window.renderCreate=renderCreate;

  if(cardId){
    const card=loadCards().find(c=>c.id===cardId);
    renderClient(card);
  } else {
    renderCreate();
  }
})();
</script>
</body>
</html>
